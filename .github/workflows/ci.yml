# PR のたびに（と、main に入ったあとにも）、テストと静的チェックを自動で走らせる。
# 手元でやっている確認（backend: gradlew check、frontend: lint / test / build）と同じものを、GitHub の上で行う。
# 使う部品（uses）は、版の名前ではなく、コミットの ID で固定している（後ろのコメントが、版の名前）。
# 差し替えられた部品を、知らずに使ってしまうのを防ぐため
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 読むだけの権限にする（書き込みや、秘密情報は使わない）
permissions:
  contents: read

# 同じ PR に続けて push したときは、古い実行を止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 実行環境（OS）は、確かめて成功した Ubuntu 24.04 に固定している。ubuntu-latest は、2026年10月から Ubuntu 26 へ切り替わっていくため、
# 気づかないうちに環境が変わって、CI が失敗するのを防ぐ。Ubuntu 26 に上げるときは、確かめてから、ここを書き換える

jobs:
  backend:
    name: backend（gradlew check）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      # application.yml の ${POSTGRES_PASSWORD} に入れる値。CI には .env がないため、ここで渡す。
      # テストが使うDBは、その場で作って捨てる使い捨てのPostgreSQL（Testcontainers）なので、ダミーの値でよい
      POSTGRES_PASSWORD: ci-dummy-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # テスト（Testcontainers が Docker で PostgreSQL を起動する）、Checkstyle、SpotBugs、JaCoCo
      - run: ./gradlew check
      # 失敗したときだけ、原因を調べるためのレポートを残す
      - name: テストのレポートを残す（失敗したとき）
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-reports
          path: |
            backend/build/reports
            backend/build/test-results
          retention-days: 7

  frontend:
    name: frontend（lint・test・build）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # package-lock.json のとおりに入れる（版が勝手に変わらない）
      - run: npm ci
      - run: npm run lint
      # 整形（Prettier）が、そろっているか。ずれていたら、手元で npm run format を実行して直す
      - run: npm run format:check
      # テストと同時に、カバレッジ（どこまで通ったか）を測る。しきい値を下回ると失敗する（vite.config.ts）
      - run: npm run test:coverage
      - run: npm run build

  # Terraform のコード（terraform/）の点検。AWS には、つながない（認証も秘密も使わない）。
  # plan と apply は、CI では実行しない（AWS に何かを作る操作は、ユーザーが承認してから、手元で行う）
  terraform:
    name: terraform（fmt・validate・tflint・trivy）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.6'
          terraform_wrapper: false
      # 書式がそろっているか。ずれていたら、手元で terraform fmt を実行して直す
      - name: terraform fmt -check
        run: terraform fmt -check -recursive
        working-directory: terraform
      # 文法と、部品の使い方の検査。部品（provider）の取得だけ行い、AWS にはつながない
      - name: terraform validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
        working-directory: terraform
      # 書き方の点検（設定は terraform/.tflint.hcl）
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0
      - name: tflint
        run: |
          tflint --init
          tflint --format compact
        working-directory: terraform
        env:
          # プラグインの取得で、GitHub の回数制限に当たらないようにするための、読むだけの権限のトークン
          GITHUB_TOKEN: ${{ github.token }}
      # セキュリティの弱点。意図した設定は、terraform/.trivyignore に、理由つきで書いてある
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          trivyignores: terraform/.trivyignore
          exit-code: '1'
          hide-progress: true
