# PR のたびに（と、main に入ったあとにも）、テストと静的チェックを自動で走らせる。
# 手元でやっている確認（backend: gradlew check、frontend: lint / test / build）と同じものを、GitHub の上で行う。
# 使う部品（uses）は、版の名前ではなく、コミットの ID で固定している（後ろのコメントが、版の名前）。
# 差し替えられた部品を、知らずに使ってしまうのを防ぐため
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 読むだけの権限にする（書き込みや、秘密情報は使わない）
permissions:
  contents: read

# 同じ PR に続けて push したときは、古い実行を止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend（gradlew check）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      # application.yml の ${POSTGRES_PASSWORD} に入れる値。CI には .env がないため、ここで渡す。
      # テストが使うDBは、その場で作って捨てる使い捨てのPostgreSQL（Testcontainers）なので、ダミーの値でよい
      POSTGRES_PASSWORD: ci-dummy-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # テスト（Testcontainers が Docker で PostgreSQL を起動する）、Checkstyle、SpotBugs、JaCoCo
      - run: ./gradlew check
      # 失敗したときだけ、原因を調べるためのレポートを残す
      - name: テストのレポートを残す（失敗したとき）
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-reports
          path: |
            backend/build/reports
            backend/build/test-results
          retention-days: 7

  frontend:
    name: frontend（lint・test・build）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # package-lock.json のとおりに入れる（版が勝手に変わらない）
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
