spring:
  application:
    name: taskmanagement
  config:
    # リポジトリ直下の .env から、DBの接続情報を読み込む（backend/ から見て1つ上）
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:taskmanagement}
    username: ${POSTGRES_USER:taskmanagement}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      # Entity（Javaのクラス）に合わせて、起動時にテーブルを自動で作る・足りない列を足す
      ddl-auto: update
    # 実行されるSQLをログに出す（学習用）
    show-sql: true
