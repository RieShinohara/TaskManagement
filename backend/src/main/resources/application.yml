server:
  # この PC（127.0.0.1）からだけつなげる。指定しないと、全部の入口で待ち受けて、同じネットワークの他の PC からも、
  # ログインなしで、全データの書き出し・入れ替え（/api/backup）ができてしまう。このアプリは、この PC の中だけで使う前提
  address: 127.0.0.1
spring:
  application:
    name: taskmanagement
  config:
    # リポジトリ直下の .env から、DBの接続情報を読み込む（backend/ から見て1つ上）
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:taskmanagement}
    username: ${POSTGRES_USER:taskmanagement}
    password: ${POSTGRES_PASSWORD}
  flyway:
    # テーブルは、Flyway が、db/migration の SQL（V1、V2…）を順に流して作る。
    # Flyway を入れる前に Hibernate が作った DB（すでにテーブルがある DB）は、V1 を実行済みとみなして受け入れる（データには触れない）
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # テーブルは作らない。Entity（Javaのクラス）とテーブルが合っているかを、起動のときに確かめるだけ（ずれていたら、起動に失敗する）
      ddl-auto: validate
    # 画面への返事を作り終えるまで、DBの接続を持ち続ける仕組み（既定は true）を切る。DBを使うのは Service の中だけにして、接続を早く返す
    open-in-view: false
    # 実行されるSQLをログに出す（学習用）。普段は出さない。見たいときは、.env に SHOW_SQL=true と書く
    show-sql: ${SHOW_SQL:false}
management:
  endpoints:
    web:
      exposure:
        # 動作確認の /actuator/health だけを公開する。設定の値や部品の一覧が見える窓口は、開けない
        include: health
