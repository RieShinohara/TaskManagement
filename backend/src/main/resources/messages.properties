# エラーの返事（ProblemDetail）の detail の、日本語の文。
# Spring は、「problemDetail.」＋ 例外のクラス名 をキーにして、ここから文を探す。見つからなければ、英語の既定の文になる。
# {0}、{1} には、Spring が値を入れる（例外ごとに、入る値が決まっている）。文字コードは UTF-8。
# 注意：文の中の ' は、'' と2つ書く決まり（MessageFormat の規則）。使わないほうが安全なので、「」を使っている

# JSON が壊れている、値の型が違う、本文が空
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=リクエストの本文を読み取れません。JSONの形や、値の型を確かめてください。

# 存在しない住所（URL）。{0}：住所
problemDetail.org.springframework.web.servlet.resource.NoResourceFoundException=指定された住所は見つかりません: {0}

# その住所で使えない操作（GET / POST / PUT / DELETE）。{0}：送られてきた操作
problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException=この住所では、「{0}」の操作は使えません。

# 住所や条件の値の形が違う（例：カードのIDが数字でない、期限の日付が不正）。{0}：項目名、{1}：送られてきた値
# （キーに使うのは、実際の例外 MethodArgumentTypeMismatchException の親クラス TypeMismatchException）
problemDetail.org.springframework.beans.TypeMismatchException={0} の値「{1}」は、正しい形ではありません。

# 受け付けないデータの形式（Content-Type）。{0}：送られてきた形式
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=このデータの形式（{0}）は受け付けていません。
