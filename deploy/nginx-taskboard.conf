# =============================================================
# nginx の設定：画面を配信し、/api のお願いを、バックエンド（8080番）に中継する。
#   ブラウザから見ると、80番の1か所としか話さないので、CORS の設定は要らない。
#   バックエンドの 8080番は、サーバーの中（127.0.0.1）だけで使う。外には開けない。
# 置き場所：EC2 の /etc/nginx/default.d/taskboard.conf
#   （nginx の標準の設定が、このフォルダの .conf を、80番のサーバーの中に読み込む）
# 画面のファイル（npm run build で作った dist の中身）は、/usr/share/nginx/html に置く
# =============================================================

# 受け取れる本文の大きさ。標準は 1MB で、背景画像（5MBまで）と、
# バックアップの読み込み（20MBまで）が、途中で断られてしまう。アプリの上限より少し大きくする
client_max_body_size 25m;

# /api で始まるお願いは、バックエンドへ渡す
location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# 動作確認用（/actuator/health）は、外には出さない。サーバーの中から curl で見る

# それ以外は、画面のファイルを返す。見つからない場所（画面の中の住所）は、index.html に戻す
location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
}
